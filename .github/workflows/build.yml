name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-28" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build packages
        shell: pwsh
        run: ./scripts/package.ps1 -Abi arm64-v8a

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexusClient
          path: build-*/*.levipack

      - name: Publish release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NexusClient Build ${{ github.run_number }}
          files: build-*/*.levipack
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
